
name: ZEWS VISUALS Phase 16 Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZEWS_VISUALS_1.21.4_phase16_source.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Extract source
        run: |
          mkdir source
          unzip ZEWS_VISUALS_1.21.4_phase16_source.zip -d source

      - name: Build mod
        run: |
          WRAPPER=$(find source -name gradlew -type f | head -n 1)
          if [ -n "$WRAPPER" ]; then
            cd "$(dirname "$WRAPPER")"
            chmod +x gradlew
            ./gradlew build
          else
            BUILD=$(find source -name build.gradle -o -name build.gradle.kts | head -n 1)
            if [ -z "$BUILD" ]; then
              echo "Gradle project not found in ZIP"
              exit 1
            fi
            cd "$(dirname "$BUILD")"
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZEWS-VISUALS-PHASE16-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
